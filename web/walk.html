<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1eee7"><title>空间方案 · 走进空间</title><link rel="stylesheet" href="/walk/style.css?v=2"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head>
<body><header><a href="/" class="brand">ROOMCRAFT <span>空间方案</span></a><nav><a href="/">案例说明</a></nav></header>
<main><aside><p class="eyebrow">A HOME TO WALK THROUGH</p><h1>走进空间。</h1><p class="lead">靠近看材质，转身看光线。<br>这一次，细节在三维空间里。</p><div class="badge">净高 2.75 m <span>本地版</span></div><h2>从这里开始</h2><nav id="rooms" aria-label="选择房间"></nav><div class="map-box"><svg id="mini-map" viewBox="-1 -1 13 15" aria-label="所在位置示意图"><g id="map-rooms"></g><g id="map-camera"><circle r=".18" fill="#a67443"/><path d="M-.35 -.6L0 0 .35 -.6" fill="none" stroke="#a67443" stroke-width=".08"/></g></svg><span>位置示意 · 非施工图</span></div><p class="scope">厨房、卫浴和床品的新增细节已建入三维模型。AI 图片保留为独立参考。</p></aside>
<section class="viewer"><div class="topline"><div><span id="room-name">正在打开</span><small id="scene-label">升级场景</small></div><button id="overview">全屋俯瞰</button></div><div id="stage"><div id="viewport" tabindex="0" aria-label="三维自由漫游，拖动看四周，WASD或方向键移动"></div><div id="loading" role="status"><span class="spinner"></span><b id="loading-title">正在打开三维空间</b><p id="loading-detail">首次加载需要一点时间</p><progress id="progress" max="100" value="0"></progress><button id="retry" hidden>重新加载</button></div><div id="scene-tools"><button id="walk" aria-pressed="true">自由行走</button><button id="baseline" aria-pressed="false">对照原版 3D</button><button id="fullscreen" aria-label="全屏查看">全屏 ↗</button></div><div id="walk-pad" aria-label="行走控制"><button data-move="forward" aria-label="向前走">↑</button><div><button data-move="left" aria-label="向左走">←</button><button data-move="back" aria-label="向后走">↓</button><button data-move="right" aria-label="向右走">→</button></div></div><div id="hint" role="status">拖动看四周 · WASD / 方向按钮移动</div></div><div class="settings"><div class="light-buttons"><button id="day" aria-pressed="true">日光</button><button id="evening" aria-pressed="false">暖光夜景</button><label>灯光 <input id="brightness" aria-label="灯光亮度" type="range" min="0" max="150" value="100"><output id="brightness-value">100%</output></label></div><div><label>画质 <select id="quality"><option value="balanced">流畅</option><option value="high">精细</option></select></label><button id="doors" aria-pressed="false">开启南北推拉门</button></div></div><div class="caption"><p id="room-note">正在读取场景</p><small id="quality-note">材质、环境反射与实时阴影共同呈现；与离线效果图仍有画质差异。</small></div></section></main>
<footer><span>自由走动的真实三维场景 · 没有用效果图代替房间</span><a id="download" href="/cases/roomcraft-realtime/model.glb" download>保存三维模型 ↓</a></footer><script type="module" src="/walk/app.js?v=bath-fix-1"></script></body></html>
